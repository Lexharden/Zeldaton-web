[package]
name = "zeldathon-server"
version = "0.1.0"
edition = "2024"
default-run = "zeldathon-server"
description = "Authoritative backend for the Zeldatón race: clocks, progress, HiveShock ingestion, REST + WebSocket."

[[bin]]
name = "zeldathon-server"
path = "src/main.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
