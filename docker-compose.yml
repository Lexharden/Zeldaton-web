# Frontend + backend in Docker; nginx runs natively on the VPS (see deploy/nginx.conf).
#   cp .env.example .env   (set ADMIN_TOKEN, SITE_ADDRESS)   then:
#   docker compose up -d --build
# Both services listen on localhost only (ports: BACKEND_PORT / FRONTEND_PORT in .env); the host nginx is the single public entry point.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN (>= 16 chars)}
      # First organizer account for /admin (only used while there are no users). If ADMIN_PASSWORD is
      # empty, a random one is printed once in `docker compose logs backend`.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: https://${SITE_ADDRESS:?set SITE_ADDRESS (e.g. zeldathon.example.com)}
      STALE_HEARTBEAT_SECS: ${STALE_HEARTBEAT_SECS:-20}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - zeldathon_data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MOCK_MODE: "false"
        VITE_DEMO_MODE: "false"
        VITE_API_URL: /api
        VITE_WS_URL: /ws
        # Google Analytics 4: set GA_MEASUREMENT_ID=G-XXXXXXXXXX in .env (empty = off).
        VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"

volumes:
  zeldathon_data:
