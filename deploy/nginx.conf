# Native nginx on the VPS:  /etc/nginx/sites-available/zeldathon  (symlink into sites-enabled)
# Replace zeldaton.yafel.dev. Get the certificate with:  sudo certbot --nginx -d zeldaton.yafel.dev

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zeldaton.yafel.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zeldaton.yafel.dev;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST + admin
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Health check (backend)
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # Public live WebSocket
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # HiveShock ingestion (WebSocket /ingest + POST /ingest/events)
    location /ingest {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Website (frontend container)
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
